<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1050" viewBox="0 0 1080 1050" role="img" aria-labelledby="preview-title"><title id="preview-title">PlanET identity: coordinated three-color wordmark and terminal tiles</title><text x="60" y="65" fill="#397d80" font-size="12" font-family="sans-serif" font-weight="400">PLANET / IDENTITY 0.0.1</text><text x="60" y="115" fill="#203339" font-size="38" font-family="sans-serif" font-weight="600">Clear by design.</text><text x="60" y="152" fill="#607079" font-size="16" font-family="sans-serif" font-weight="400">Teal, sage, and warm gold. One quiet progression across letters and strokes.</text><rect x="60" y="192" width="470" height="188" rx="16" fill="#ffffff" /><rect x="550" y="192" width="470" height="188" rx="16" fill="#142925" /><rect x="60" y="400" width="470" height="188" rx="16" fill="#ffffff" /><rect x="550" y="400" width="470" height="188" rx="16" fill="#ffffff" /><text x="86" y="227" fill="#71827a" font-size="11" font-family="sans-serif" font-weight="400">01 / LIGHT</text><text x="576" y="227" fill="#aec4b9" font-size="11" font-family="sans-serif" font-weight="400">02 / DARK</text><text x="86" y="435" fill="#71827a" font-size="11" font-family="sans-serif" font-weight="400">03 / ONE COLOR</text><text x="576" y="435" fill="#71827a" font-size="11" font-family="sans-serif" font-weight="400">04 / ORBITAL MARK</text><rect x="60" y="608" width="960" height="352" rx="16" fill="#192326" /><text x="86" y="645" fill="#a5b6af" font-size="11" font-family="sans-serif" font-weight="400">05 / TERMINAL</text><text x="86" y="690" fill="#81b4ae" font-size="26" font-family="sans-serif" font-weight="400">P</text><text x="103" y="690" fill="#81b4ae" font-size="26" font-family="sans-serif" font-weight="400">l</text><text x="120" y="690" fill="#a4bba4" font-size="26" font-family="sans-serif" font-weight="400">a</text><text x="137" y="690" fill="#a4bba4" font-size="26" font-family="sans-serif" font-weight="400">n</text><text x="